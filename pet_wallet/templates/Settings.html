<html> 
<head> 
<title>Pet Wallet</title> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    body {
        font-family: "Times New Roman", serif;
        margin: 0;
        color: black;
        text-align: center;
        background-color: white;
        height: 100vh;
        display: flex;
        flex-direction: column;
    }

    ul {
        position: sticky;
        top: 0;
        z-index: 100;
        list-style-type: none;
        margin: 0;
        padding: 0;
        background-color: #0031AD;
        display: flex;
        align-items: center;
    }

    .logo {
        width: 200px;
        height: 100px;
        object-fit: contain;
    }

    ul li a {
        display: block;
        color: F2F7FF;
        text-align: center;
        padding: 25px 25px;
        text-decoration: none;
        font-size: 30px;
    }

    ul li a:hover {
        background-color: #002475;
    }

    h1 {
        font-size: 60px;
        margin-top: 20px;
        color: #3333333;
        margin-bottom: 10px;
    }
    table {
    margin: 30px auto;
    border-collapse: collapse;
    width: 70%;
    font-size: 25px;
}

th, td {
    border: 2px solid black;
    padding: 15px;
    text-align: center;
}

th {
    background-color: black;
    color: white;
}

td {
    background-color: white;
}

</style>

</head> <body>

<ul>

    <li>
        <a href="index.html">
            <img
                src="logo.jpeg"
                alt="Pet Wallet Logo"
                class="logo"
                style="width: 30px; height: 20px; object-fit: contain;"
            >
        </a>
    </li>
    <li>
        <a href="Settings.html"  style="font-size: 20px;">Settings</a>
    </li>

    <li>
        <a href="Transactions.html"  style="font-size: 20px;">Transactions</a>
    </li>

</ul>

<h1>Current Settings</h1>
    <table>
    <tr>
        <th>Name</th>
        <th>Upper End</th>
        <th>Lower End</th>
    </tr>

    {%- for budget in budgets %}
    <tr>
        <td>{{ budget[0]|safe }}</td>
        <td>{{ budget[1]|safe }}</td>
        <td>{{ budget[2]|safe }}</td>
    </tr>
    {%- endfor %}
</table>
<a href="FORM.html">
<button style="
    font-size: 20px;
    background-color: #0031AD;
    color: white;
    width: 200px;
    height: 100px;
    margin-top: 250px;
    margin-right: auto;
    margin-left: auto;
"> Submit New Budget
</button>
</a>
</body> </html>
