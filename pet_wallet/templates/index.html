<html> 
<head> 
<title>Pet Wallet</title> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    body {
        font-family: Monaco, monospace;
        margin: 0;
        color: 002475;
        text-align: center;
        background-color: white;
        height: 100vh;
        display: flex;
        flex-direction: column;
    }

    ul {
        position: sticky;
        top: 0;
        z-index: 100;
        list-style-type: none;
        margin: 0;
        padding: 0;
        background-color: #0031AD;
        display: flex;
        align-items: center;
    }

    .logo {
        width: 200px;
        height: 100px;
        object-fit: contain;
    }

    ul li a {
        display: block;
        color: white;
        text-align: center;
        padding: 25px 25px;
        text-decoration: none;
        font-size: 30px;
    }

    ul li a:hover {
        background-color: #002475;
    }

    h1 {
        font-size: 60px;
        margin-top: 20px;
        margin-bottom: 10px;
    }

    h2 {
        font-size: 40px;
        margin-top: 0;
    }

    .image-container {
        position: relative;
        width: 100%;
        flex: 1;
        overflow: hidden;
    }

    .background-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

       .overlay-image {
        position: absolute;
        top: 55%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 40%;
        height: auto;
        z-index: 10;
        cursor: pointer;
    }
            .popup {
            display: none;
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
             z-index: 100;
        }
        .popup-content {
            background: #fff;
            padding: 20px;
            border-radius: 5px;
            text-align: center;
            width: 60%; height: 50%;
        }
        .popup:target {
            display: flex;
        }
</style>

</head> <body>
<ul>

  
    <li>
        <a href="{{ url_for('root') }}">
            <img
                src="/static/logo.jpeg"
                alt="Pet Wallet Logo"
                class="logo"
                style="width: 50px; height: 50px; object-fit: contain;"
            >
        </a>
    </li>
    <li>
        <a href="{{ url_for('settings_page') }}"  style="font-size: 20px;">Settings</a>
    </li>

    <li>
        <a href="{{ url_for('transactions_page') }}"  style="font-size: 20px;">Transactions</a>
    </li>

</ul>

<h1>Welcome to Pet Wallet</h1>

<h2>Where Finance Meets Fun</h2>

<div class="image-container">
    <img
        src="/static/backdrop.jpeg"
        alt="Background Image"
        class="background-image"
    >
    <img
        src="{{ creature_img }}"
        alt="creature"
        class="overlay-image"
        <button id="openPopup" style="padding: 10px 20px; color: #fff; border: none; border-radius: 5px;">Open Popup</button>
    <div id="popup" class="popup">
        <div class="popup-content">
            <h2>Stats</h2>
            <button id="closePopup" style="margin-top: 120px; padding:
                                           15px 10px;  background-color: #002475; color: #fff;
                                           border: none; border-radius 3px;">Close</button>
        </div>
    </div>
    <script>
        const openPopup = document.getElementById('openPopup');
        const closePopup = document.getElementById('closePopup');
        const popup = document.getElementById('popup');

        openPopup.addEventListener('click', () => {
            popup.style.display = 'flex';
        });

        closePopup.addEventListener('click', () => {
            popup.style.display = 'none';
        });

        window.addEventListener('click', (event) => {
            if (event.target === popup) {
                popup.style.display = 'none';
            }
        });
    </script>
    >
</body> </html>
