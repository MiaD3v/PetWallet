<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pet Wallet</title>
<style>
    body {
        font-family: Monaco, monospace;
        margin: 0;
        color: #002475;
        text-align: center;
        background-color: white;
        height: 100vh;
        display: flex;
        flex-direction: column;
    }

    ul {
        position: sticky;
        top: 0;
        z-index: 100;
        list-style-type: none;
        margin: 0;
        padding: 0;
        background-color: #0031AD;
        display: flex;
        align-items: center;
    }

    .logo {
        width: 200px;
        height: 100px;
        object-fit: contain;
    }

    ul li a {
        display: block;
        color: white;
        text-align: center;
        padding: 25px 25px;
        text-decoration: none;
        font-size: 30px;
    }

    ul li a:hover {
        background-color: #002475;
    }

    h1 {
        font-size: 40px;
        margin-top: 20px;
        margin-bottom: 10px;
    }
    .budget-form {
    max-width: 500px;
    margin: 40px auto;
    padding: 30px;
}

.form-row {
    display: grid;
    grid-template-columns: 140px 1fr;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
}

.form-row label {
    font-weight: 600;
    color: #333;
}

.form-row input[type="Name"],
.form-row input[type="Upper End"],
.form-row input[type="Lower End"] {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
    transition: border-color 0.2s, box-shadow 0.2s;
}

.form-row input:focus {
    outline: none;
    border-color: #4a90e2;
    box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.15);
}

.form-row span {
    display: block;
}

.form-row input[type="submit"],
.form-row button {
    padding: 10px 20px;
    background: #4a90e2;
    color: #002475;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
}

.form-row input[type="submit"]:hover,
.form-row button:hover {
    background: #357abd;
}

</style>

</head> <body>
<ul>

  
    <li>
        <a href="{{ url_for('root') }}">
            <img
                src="/static/logo.jpeg"
                alt="Pet Wallet Logo"
                class="logo"
                style="width: 50px; height: 50px; object-fit: contain;"
            >
        </a>
    </li>
    <li>
        <a href="{{ url_for('settings_page') }}"  style="font-size: 20px;">Settings</a>
    </li>

    <li>
        <a href="{{ url_for('transactions_page') }}"  style="font-size: 20px;">Transactions</a>
    </li>

</ul>

<h1> Create New Budget Category</h1>

<form action="{{ url_for(request.endpoint) }}" method="POST" class="budget-form">
    {{ form.hidden_tag() }}

    <div class="form-row">
        {{ form.budget_name.label }}
        {{ form.budget_name() }}
    </div>

    <div class="form-row">
        {{ form.budget_low.label }}
        {{ form.budget_low() }}
    </div>

    <div class="form-row">
        {{ form.budget_high.label }}
        {{ form.budget_high() }}
    </div>

    <div class="form-row">
        <span></span>
        {{ form.submit_field() }}
    </div>
</form>

</body> </html>
